name: Desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'packaging/**'
      - 'perfeval/**'
      - 'services/**'
      - 'pyproject.toml'
      - 'LICENSE'
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'packaging/**'
      - 'perfeval/**'
      - 'services/**'
      - 'pyproject.toml'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            arch: arm64
            build: packaging/macos/build-electron.py
            output: services/desktop/dist/mac-release
            suffix: macos-arm64.dmg
          - platform: windows-x64
            runner: windows-2025
            arch: x64
            build: packaging/windows/build-electron.py
            output: services/desktop/dist/windows-x64
            suffix: windows-x64-setup.exe
    env:
      PERFEVAL_DESKTOP_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            services/frontend/package-lock.json
            services/desktop/package-lock.json
      - name: Build and verify macOS DMG
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ env.PERFEVAL_DESKTOP_RELEASE_TAG != '' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.PERFEVAL_DESKTOP_RELEASE_TAG != '' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ env.PERFEVAL_DESKTOP_RELEASE_TAG != '' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.PERFEVAL_DESKTOP_RELEASE_TAG != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.PERFEVAL_DESKTOP_RELEASE_TAG != '' && secrets.APPLE_TEAM_ID || '' }}
        run: python ${{ matrix.build }}
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ env.PERFEVAL_DESKTOP_RELEASE_TAG != '' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ env.PERFEVAL_DESKTOP_RELEASE_TAG != '' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: python ${{ matrix.build }}
      - name: Install and verify with an isolated PATH
        if: runner.os == 'Windows'
        run: |
          $installer = @(Get-ChildItem services/desktop/dist/windows-x64/PerfEval-Desktop-*-windows-x64-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one x64 setup executable' }
          python packaging/windows/smoke-electron.py $installer[0].FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          path: |
            ${{ matrix.output }}/PerfEval-Desktop-*-${{ matrix.suffix }}
            ${{ matrix.output }}/PerfEval-Desktop-*-${{ matrix.suffix }}.sha256

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Verify both assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#desktop-v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid desktop release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          mac="PerfEval-Desktop-${version}-macos-arm64.dmg"
          win="PerfEval-Desktop-${version}-windows-x64-setup.exe"
          assets=("$mac" "$mac.sha256" "$win" "$win.sha256")
          sha256sum --check --strict "$mac.sha256" "$win.sha256"
          for asset in "${assets[@]}"; do test -s "$asset"; done

          marker='<!-- perfeval-desktop-release-ci -->'
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft,assets,body); then
            if ! jq -e '.isDraft' <<< "$existing" >/dev/null; then
              for asset in "${assets[@]}"; do
                jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$existing" >/dev/null
              done
              echo "$RELEASE_TAG is already published with both installers and checksums."
              exit 0
            fi
            if ! jq -e --arg marker "$marker" '.body | contains($marker)' <<< "$existing" >/dev/null; then
              echo "$RELEASE_TAG has a draft created outside this workflow." >&2
              exit 1
            fi
          else
            options=()
            if [[ $version == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "PerfEval Desktop v$version" --notes "$marker" "${options[@]}"
          fi

          gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
