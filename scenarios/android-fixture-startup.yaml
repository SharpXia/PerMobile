schemaVersion: perfeval.scenario.v1
project: PerMobile
scenarioId: android_fixture_startup
description: Android fixture cold start with optional injected delay.
gui:
  quickStart: false

apps:
  - id: baseline
    platform: android
    packageName: com.perfeval.fixture
    artifact: ./fixtures/android-fixture/baseline.apk
    versionName: 1.0.0
    versionCode: 100
  - id: candidate
    platform: android
    packageName: com.perfeval.fixture
    artifact: ./fixtures/android-fixture/candidate.apk
    versionName: 1.0.1
    versionCode: 101

devices:
  - id: android_lab
    platform: android
    selector:
      serial: auto
    tags: [android, lab]

run:
  repeats: 5
  warmups: 1
  mode: same_device_versions
  install:
    clearData: true
    reinstall: true

flow:
  driver: adb_script
  timeoutMs: 30000
  steps:
    - type: launch
      activity: .MainActivity
      marker: app_launch
    - type: idle
      durationMs: 2000

collectors:
  android:
    logcat: true
    gfxinfo: true
    meminfo: true
    perfetto:
      enabled: auto
      durationMs: 20000

budgets:
  startup.cold.ms:
    direction: lower_better
    failAbs: 2500
    warnRegressionPct: 0.08
    failRegressionPct: 0.15
    minDeltaAbs: 80
  frame.jank_rate:
    direction: lower_better
    warnAbs: 0.05
    failAbs: 0.10
  memory.pss.peak_mb:
    direction: lower_better
    warnRegressionPct: 0.10
    failRegressionPct: 0.20
    minDeltaAbs: 30
