schemaVersion: perfeval.scenario.v1
project: PerfEval Lite
scenarioId: quick_version_ab
description: Quick Android baseline and candidate comparison.
memoryProfile: mainstream

apps:
  - id: baseline
    platform: android
  - id: candidate
    platform: android

run:
  repeats: 3
  mode: same_device_versions
  install:
    clearData: false

flow:
  driver: adb_script
  timeoutMs: 90000
  steps:
    - type: launch
    - type: manual
      prompt: "请导航到目标操作的固定起点，准备完成后点击继续。"
      timeoutMs: 60000
    - type: reset_gfxinfo
    - type: manual
      prompt: "请执行一次固定的目标操作，完成后点击继续开始采集。"
      timeoutMs: 60000
    - type: idle
      durationMs: 1000

budgets:
  frame.jank_rate:
    direction: lower_better
    warnAbs: 0.05
    failAbs: 0.10
    warnRegressionAbs: 0.02
    failRegressionAbs: 0.05
    minDeltaAbs: 0.01
  frame.duration.p95.ms:
    direction: lower_better
    warnRegressionPct: 0.10
    failRegressionPct: 0.20
    minDeltaAbs: 5
  memory.pss.peak_mb:
    direction: lower_better
    warnRegressionPct: 0.10
    failRegressionPct: 0.20
    minDeltaAbs: 30
