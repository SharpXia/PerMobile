# PerfEval Desktop 打包配置（electron-builder 26；无构建步骤，主进程/preload 原样进包）
appId: local.perfeval.desktop
productName: PerfEval Desktop
icon: ../../packaging/pyinstaller/assets/perfeval-icon.svg
directories:
  output: dist
  buildResources: build

# 无运行时依赖（electron/electron-builder 均为 devDependencies，electron-builder 自动剔除），
# 只需主进程与 preload 两个入口文件；backend/ 走 extraResources，不进 asar。
files:
  - main.js
  - preload.js
  - package.json

beforePack: ./check-windows-resources.cjs

mac:
  identity: null # 不做签名/公证，本地分发
  category: public.app-category.developer-tools
  extraResources:
    - from: backend
      to: backend
  target:
    - dir
    - dmg

linux:
  extraResources:
    - from: backend
      to: backend

win:
  target:
    - target: nsis
      arch: x64
  extraResources:
    - from: ../../build/windows-electron/staging/backend
      to: backend
    - from: ../../build/windows-electron/staging/platform-tools
      to: platform-tools
    - from: ../../LICENSE
      to: licenses/PerMobile.txt

nsis:
  artifactName: PerfEval-Desktop-${version}-windows-x64-setup.${ext}
  include: ../../packaging/windows/installer.nsh
  perMachine: false
