[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfeval-lite"
version = "0.2.0"
description = "Lightweight mobile app performance evaluator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.7,<7",
    "keyring>=25,<27",
]
gui-dev = [
    "PySide6>=6.7,<7",
    "keyring>=25,<27",
    "pytest>=8",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
perfeval = "perfeval.cli.main:main"
perfeval-gui = "perfeval.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["perfeval*"]

[tool.setuptools.package-data]
perfeval = ["fixtures/android/golden/*.txt", "fixtures/android/golden/*.pftrace", "fixtures/synthetic/golden/*.json", "core/report/vendor/echarts.min.js", "gui/resources/presets/*.json", "gui/resources/presets/*.yaml"]
